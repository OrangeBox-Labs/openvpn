##############################################################################
#                                                                              
# OpenVPN Access Manager - Configuración de Acceso
# OrangeBox Latam
#
# Este archivo define todos los grupos de acceso disponibles.
# Cada grupo contiene una lista de destinos (IPs o redes) separados por comas.
#
# Formato: GROUP_NOMBRE="IP1,IP2,NETWORK/CIDR,ALL"
#
# Uso: # ACCESS=GRUPO1,GRUPO2,GRUPO3 en el archivo CCD del cliente
#                                                                              
##############################################################################

#
# Cadena de iptables
#
CHAIN="OPENVPN"

#
# Política por defecto (DROP | ACCEPT)
#
DEFAULT_POLICY="DROP"

##############################################################################
#                                                                              
# SERVIDORES Y SERVICIOS
#                                                                              
##############################################################################

#
# DNS
#
GROUP_DNS="192.168.10.2"

#
# Active Directory
#
GROUP_AD="192.168.10.10,192.168.10.11"

#
# Servidores WEB
#
GROUP_WEB="192.168.10.20,192.168.10.21"

#
# Servidores de Archivos
#
GROUP_FILESERVER="192.168.10.30"

#
# Monitoreo
#
GROUP_MONITOREO="192.168.200.240"

#
# Backups
#
GROUP_BACKUP="192.168.50.20"

#
# vCenter
#
GROUP_VCENTER="192.168.100.50"

##############################################################################
#                                                                              
# REDES
#                                                                              
##############################################################################

#
# DMZ
#
GROUP_DMZ="172.16.0.0/24"

#
# Red Local
#
GROUP_LAN="192.168.0.0/16"

#
# Internet (requiere NAT o ruteo configurado)
#
GROUP_INTERNET="0.0.0.0/0"

##############################################################################
#                                                                              
# ACCESO ESPECIAL
#                                                                              
##############################################################################

#
# Acceso Total - Permite acceder a TODO (uso con precaución)
#
GROUP_VIP="ALL"

##############################################################################
#                                                                              
# EJEMPLOS DE USO
#                                                                              
##############################################################################

#
# Para crear nuevos grupos, simplemente agrega una línea:
#
# GROUP_NUEVO_SERVICIO="192.168.100.100"
# GROUP_NUEVA_RED="10.10.0.0/16"
#
# Luego en el CCD del cliente:
# # ACCESS=DNS,WEB,NUEVO_SERVICIO
#

##############################################################################
